<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive 3D visualization of the International Space Station orbiting Earth. Academic project." />
  <meta name="theme-color" content="#020617" />
  <title>ISS Orbit Viewer — 3D Earth &amp; International Space Station</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #020617; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #020617; z-index: 100; color: #cbd5e1; gap: 12px; transition: opacity 0.6s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid #1e293b; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 13px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div id="loading-msg">Loading ISS data…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
